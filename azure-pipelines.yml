trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - script: docker build -t bodega-database:$(Build.BuildId) .
    displayName: Construir la imagen Docker

  - script: |
      sudo apt-get update -y
      sudo apt-get install -y postgresql-client
    displayName: Instalar el cliente de PostgreSQL

  - script: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f init.sql
    displayName: Cargar esquema y datos en la base de datos de Render
    env:
      DATABASE_URL: $(DATABASE_URL)